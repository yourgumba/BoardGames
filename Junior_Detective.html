<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest-jd.json">
<meta name="theme-color" content="#0e7490">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-jd-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Junior Detective Notebook</title>
<style>
  /* Self-contained: no outside files. */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; color: #fff; touch-action: manipulation; font-family: ui-rounded, "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(circle at top, #155e75 0%, #0f172a 75%);
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
  button, input, select, textarea { font: inherit; }
  button { color: inherit; cursor: pointer; }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: .05em; text-transform: uppercase; }
  h2 { margin: 18px 0 8px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #67e8f9; display: flex; justify-content: space-between; align-items: center; }
  h2 span { color: #fde68a; font-size: 14px; letter-spacing: 0; }
  .top { display: flex; gap: 8px; } .top input { flex: 1; } .top button { flex: 0 0 auto; }
  input, select, textarea { width: 100%; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 10px; padding: 10px; font-size: 16px; }
  .btn { background: #1e293b; border: 1px solid #475569; border-radius: 10px; padding: 10px 12px; font-weight: 800; }
  .btn.on { background: #0e7490; border-color: #fbbf24; }
  .go { width: 100%; margin-top: 8px; padding: 14px; background: #fbbf24; color: #000; border: 0; border-bottom: 5px solid #d97706; border-radius: 14px; font-size: 18px; font-weight: 900; text-transform: uppercase; }
  #banner { display: none; margin-bottom: 10px; text-align: center; font-weight: 900; font-size: 18px; background: #fbbf24; color: #000; border-radius: 14px; padding: 12px; }
  #banner.show { display: block; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { position: relative; background: #fff; color: #0f172a; border: 2px solid #e2e8f0; border-radius: 12px; padding: 4px 2px 6px; text-align: center; font-weight: 800;
          user-select: none; -webkit-user-select: none; cursor: pointer; }
  .tile:active { transform: scale(.95); }
  .tile svg { width: 100%; max-width: 72px; display: block; margin: 0 auto; }
  .tile b { position: absolute; top: 3px; left: 6px; font-size: 14px; color: #64748b; }
  .tile small { display: block; font-size: 14px; }
  .tile.out { background: #ffe4e6; border-color: #f43f5e; } .tile.out > :not(.mark) { opacity: .3; filter: grayscale(.8); }
  .tile.yes { background: #dcfce7; border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,.35); } .tile.yes > :not(.mark) { opacity: .4; }
  .tile.auto { border-style: dashed; }
  .mark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 3.2rem; font-weight: 900; pointer-events: none; text-shadow: 0 0 4px #fff; }
  .out .mark { color: #e11d48; } .yes .mark { color: #15803d; }
  .last { border-color: #f59e0b; animation: glow 1.3s ease-in-out infinite; }
  @keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(245,158,11,.7); } 50% { box-shadow: 0 0 0 7px rgba(245,158,11,0); } }
  .card { background: rgba(15,23,42,.75); border: 1px solid #334155; border-radius: 14px; padding: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .row { display: flex; gap: 8px; margin-top: 8px; } .row > * { flex: 1; }
  .clue { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding: 8px 10px; background: #1e293b; border-radius: 10px; font-size: 14px; }
  .clue span { flex: 1; } .clue button { flex: 0 0 auto; padding: 6px 10px; border-radius: 8px; border: 0; background: #334155; font-weight: 800; }
  .clue .t { background: #16a34a; } .clue .l { background: #dc2626; }
  .wit { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .wit button { flex: 0 0 38px; height: 38px; border-radius: 10px; border: 2px solid #475569; background: #1e293b; font-weight: 900; }
  .wit button.v { background: #16a34a; border-color: #16a34a; }
  .wit label { flex: 0 0 125px; font-size: 13px; font-weight: 800; line-height: 1.1; } .wit label small { color: #94a3b8; display: block; font-weight: 600; }
  .wit input { padding: 8px; font-size: 14px; }
  .hide { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .hide .tile { padding: 14px 6px; font-size: 16px; }
  textarea { min-height: 90px; }
  .msg { color: #94a3b8; font-size: 13px; margin-top: 6px; }
  #sheet { display: none; position: fixed; inset: 0; z-index: 10; background: rgba(2,6,23,.75); align-items: flex-end; justify-content: center; }
  #sheet.show { display: flex; }
  .panel { width: 100%; max-width: 520px; background: #1e293b; border-radius: 22px 22px 0 0; padding: 16px 14px max(16px, env(safe-area-inset-bottom)); max-height: 90vh; overflow: auto; }
  .panel h3 { margin: 0 0 4px; } .panel p { margin: 0 0 10px; color: #94a3b8; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>&#128269; Junior Detective Notebook</h1>
  <div class="top"><input id="caseNo" placeholder="Case # or name" oninput="S.caseNo=this.value;save()"><button class="btn" onclick="newCase()">New case</button></div>

  <h2>Suspects <span id="left"></span></h2>
  <div id="banner"></div>
  <div class="grid" id="suspects"></div>
  <div class="msg">Tap: &#10005; &rarr; &#10003; &rarr; clear. Dashed tiles were crossed off by a clue.</div>

  <h2>Add a clue</h2>
  <div class="card">
    <div class="msg" style="margin:0">1. Pick the trait (tap &#9998; to choose who has it)</div>
    <div class="chips" id="traitChips"></div>
    <div class="row"><button class="btn" id="hasY" onclick="S.has=true;render()">Culprit HAD it</button><button class="btn" id="hasN" onclick="S.has=false;render()">Culprit did NOT</button></div>
    <div class="msg">2. Which witness said it?</div>
    <select id="whoSel"></select>
    <button class="go" onclick="addClue()">Add clue</button>
  </div>
  <div id="clues"></div>
  <button class="btn" style="width:100%;margin-top:8px" onclick="allTruthful()">Mrs. Wise says: everyone is truthful</button>

  <h2>Hiding spot <span id="hleft"></span></h2>
  <div class="hide" id="hide"></div>

  <h2>Witnesses</h2>
  <div class="card" id="wits"></div>

  <h2>Notes</h2>
  <textarea id="notes" placeholder="Anything else you learn..." oninput="S.notes=this.value;save()"></textarea>
</div>

<div id="sheet" onclick="if (event.target === this) closeSheet()"><div class="panel" id="panel"></div></div>

<script>
  /* ---------- THE SUSPECTS (original cartoon faces; edit here) ---------- */
  // hs = hair style, hat = "type:color", gl = glasses (1 clear, 2 dark), x = extra
  const SUSPECTS = [
    { n: 1,  name: "Andr\u00E9",   skin: "#f2c9a0", hair: "#3b2f2f", hs: "short", hat: "beret:#1f2937", shirt: "#475569" },
    { n: 2,  name: "Billie",  skin: "#f5d0b0", hair: "#6b4f3a", hs: "puff",  gl: 1, shirt: "#a855f7" },
    { n: 3,  name: "David",   skin: "#f6d5b5", hair: "#e5e7eb", hs: "short", hat: "cap:#3b82f6", shirt: "#475569" },
    { n: 4,  name: "Elani",   skin: "#c68642", hair: "#2b2b2b", hs: "long",  shirt: "#0f766e" },
    { n: 5,  name: "Gupil",   skin: "#f1c8a5", hair: "#2b2b2b", hs: "none",  hat: "cap:#374151", gl: 1, shirt: "#1e3a8a" },
    { n: 6,  name: "Maya",    skin: "#8d5524", hair: "#9ca3af", hs: "puff",  gl: 1, shirt: "#ca8a04" },
    { n: 7,  name: "Miguel",  skin: "#e0ac82", hair: "#2b2b2b", hs: "curly", hat: "beanie:#d6c7a1", shirt: "#334155" },
    { n: 8,  name: "Najwa",   skin: "#f6d9c2", hair: "#f3f4f6", hs: "long",  gl: 1, shirt: "#0f172a" },
    { n: 9,  name: "Quentin", skin: "#f2c9a0", hair: "#2b2b2b", hs: "none",  hat: "bowler:#111827", gl: 1, x: "bow", shirt: "#7c3aed" },
    { n: 10, name: "Scarlett", skin: "#8a6a52", hair: "#3b2f2f", hs: "curly", hat: "witch:#1f2937", gl: 1, shirt: "#111827" },
    { n: 11, name: "Tobias",  skin: "#f2c9a0", hair: "#2b2b2b", hs: "none",  hat: "cowboy:#f5f5f4", gl: 2, shirt: "#78716c" },
    { n: 12, name: "Wendy",   skin: "#b9794a", hair: "#111111", hs: "short", x: "flower", shirt: "#be185d" }
  ];
  const HATS = {
    beret:  c => `<ellipse cx="19" cy="12" rx="10" ry="4.5" fill="${c}" transform="rotate(-10 19 12)"/><circle cx="19" cy="7.6" r="1" fill="${c}"/>`,
    cap:    c => `<path d="M11 15c0-7 4-9 9-9s9 2 9 9z" fill="${c}"/><rect x="21" y="13.5" width="12" height="3" rx="1.5" fill="${c}"/>`,
    beanie: c => `<path d="M11 15c0-8 4-10 9-10s9 2 9 10z" fill="${c}"/><circle cx="20" cy="4.5" r="2.4" fill="#fff"/><rect x="11" y="13" width="18" height="3.5" rx="1.5" fill="#b8a888"/>`,
    bowler: c => `<path d="M12 14c0-7 3-9 8-9s8 2 8 9z" fill="${c}"/><rect x="8" y="13.5" width="24" height="3" rx="1.5" fill="${c}"/>`,
    witch:  c => `<path d="M20 0l7 14H13z" fill="${c}"/><rect x="7" y="13.5" width="26" height="3" rx="1.5" fill="${c}"/>`,
    cowboy: c => `<path d="M14 14V6c0-3 12-3 12 0v8z" fill="${c}" stroke="#a8a29e" stroke-width=".8"/><path d="M5 16c4-4 26-4 30 0 0 2-30 2-30 0z" fill="${c}" stroke="#a8a29e" stroke-width=".8"/>`
  };
  function face(s) {
    const back = s.hs === "long" ? `<path d="M9 22c-2-12 4-17 11-17s13 5 11 17v11h-5V20H14v13H9z" fill="${s.hair}"/>`
      : s.hs === "puff" ? `<circle cx="20" cy="10" r="9" fill="${s.hair}"/>` : "";
    const front = s.hs === "short" ? `<path d="M12 18c0-7 3-10 8-10s8 3 8 10c-2-3-5-4-8-4s-6 1-8 4z" fill="${s.hair}"/>`
      : s.hs === "curly" ? [[13,13],[18,10],[23,10],[27,13],[11,19],[29,19]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.6" fill="${s.hair}"/>`).join("") : "";
    const [ht, hc] = (s.hat || ":").split(":");
    const gl = s.gl ? `<circle cx="16" cy="22" r="3.4" fill="${s.gl === 2 ? "#111" : "#fff"}" fill-opacity="${s.gl === 2 ? 1 : .35}" stroke="#111" stroke-width="1.3"/><circle cx="24" cy="22" r="3.4" fill="${s.gl === 2 ? "#111" : "#fff"}" fill-opacity="${s.gl === 2 ? 1 : .35}" stroke="#111" stroke-width="1.3"/><path d="M19.4 22h1.2" stroke="#111" stroke-width="1.2"/>` : "";
    const eyes = s.gl === 2 ? "" : `<circle cx="16" cy="22" r="1.2" fill="#111"/><circle cx="24" cy="22" r="1.2" fill="#111"/>`;
    const x = s.x === "bow" ? `<path d="M20 34l-4-2v4zM20 34l4-2v4z" fill="#dc2626"/>` : s.x === "flower" ? `<circle cx="11.5" cy="25" r="1.8" fill="#f9a8d4"/>` : "";
    return `<svg viewBox="0 0 40 40" aria-hidden="true">${back}<path d="M6 40c0-6 5-8 14-8s14 2 14 8z" fill="${s.shirt}"/>
      <circle cx="11.5" cy="23" r="2.2" fill="${s.skin}"/><circle cx="28.5" cy="23" r="2.2" fill="${s.skin}"/><circle cx="20" cy="22" r="8.6" fill="${s.skin}"/>${front}${eyes}${gl}
      <path d="M17 26.5q3 2.4 6 0" fill="none" stroke="#7c2d12" stroke-width="1.2" stroke-linecap="round"/>${x}${HATS[ht] ? HATS[ht](hc) : ""}</svg>`;
  }

  /* ---------- OTHER GAME DATA ---------- */
  const WITNESSES = [["Chip Scoops", "Ice cream truck"], ["Mr. Sweeps", "School"], ["Jackie Russell", "Pet store"], ["Peppy Roni", "Pizza place"], ["Ferris the Great", "Carnival"], ["Dottie Drip", "Coffee shop"], ["Mrs. Wise", "Library (checks lies)"], ["The Spy", "Playground (hiding spot)"]];
  const HIDING = ["School mascot", "Clown", "Pizza boxes", "Library cart"];
  const PRESET_TRAITS = [
    { id: "hat", name: "Hat", set: [1, 3, 5, 7, 9, 10, 11], ready: true },
    { id: "glasses", name: "Glasses", set: [2, 5, 6, 8, 9, 10, 11], ready: true },   // confirmed by the rulebook
    { id: "freckles", name: "Freckles", set: [], ready: false }                       // tap the pencil to set this one up
  ];

  /* ---------- STATE (saved on the phone) ---------- */
  const KEY = "junior_detective_v1", $ = id => document.getElementById(id);
  const fresh = () => ({ m: {}, clues: [], hide: {}, vis: {}, wn: {}, notes: "", caseNo: "" });
  let S = Object.assign(fresh(), { traits: JSON.parse(JSON.stringify(PRESET_TRAITS)), sel: "hat", has: true });
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d) S = Object.assign(S, d); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const trait = id => S.traits.find(t => t.id === id);

  /* ---------- THE LOGIC ---------- */
  // Suspects crossed off automatically by clues Mrs. Wise has checked (a lying witness flips the clue)
  function derived() {
    const out = {};
    S.clues.forEach(c => {
      const t = trait(c.t); if (!t || !c.wise) return;
      const truth = c.wise === 1 ? c.has : !c.has;
      SUSPECTS.forEach(s => { if (t.set.includes(s.n) !== truth) out[s.n] = true; });
    });
    return out;
  }
  const isOut = (n, d) => S.m[n] === 2 ? false : (S.m[n] === 1 || !!d[n]);

  /* ---------- SCREEN ---------- */
  function render() {
    const d = derived(), left = SUSPECTS.filter(s => !isOut(s.n, d));
    $("caseNo").value = S.caseNo; $("notes").value = S.notes;
    $("left").textContent = left.length + " left";
    $("suspects").innerHTML = SUSPECTS.map(s => {
      const o = isOut(s.n, d), y = S.m[s.n] === 2, last = left.length === 1 && left[0].n === s.n;
      return `<div class="tile ${o ? "out" : ""} ${y ? "yes" : ""} ${o && !S.m[s.n] ? "auto" : ""} ${last ? "last" : ""}" onclick="tapSuspect(${s.n})"><b>${s.n}</b>${face(s)}<small>${esc(s.name)}</small>${o ? '<div class="mark">\u2715</div>' : y ? '<div class="mark">\u2713</div>' : ""}</div>`;
    }).join("");
    $("banner").classList.toggle("show", left.length === 1);
    if (left.length === 1) $("banner").innerHTML = `&#127919; Culprit: #${left[0].n} ${esc(left[0].name)}`;

    $("traitChips").innerHTML = S.traits.map(t => `<button class="btn ${S.sel === t.id ? "on" : ""}" onclick="S.sel='${t.id}';render()">${esc(t.name)}${t.ready ? "" : " \u26A0"}</button>`).join("") +
      `<button class="btn" onclick="editTrait(S.sel)">&#9998;</button><button class="btn" onclick="newTrait()">+ New</button>`;
    $("hasY").classList.toggle("on", S.has); $("hasN").classList.toggle("on", !S.has);
    if (!$("whoSel").options.length) $("whoSel").innerHTML = WITNESSES.slice(0, 6).map(w => `<option>${w[0]}</option>`).join("");

    $("clues").innerHTML = S.clues.map((c, i) => {
      const t = trait(c.t), lbl = ["? Ask Mrs. Wise", "\u2713 Truthful", "\u2717 Lying"][c.wise], cls = ["", "t", "l"][c.wise];
      return `<div class="clue"><span><b>${esc(c.w)}:</b> had ${c.has ? "" : "NO "}${t ? esc(t.name) : "?"}${t && !t.ready ? " \u26A0 set up trait" : ""}</span><button class="${cls}" onclick="cycleWise(${i})">${lbl}</button><button onclick="delClue(${i})">\u2715</button></div>`;
    }).join("") || '<div class="msg">No clues yet. Add what each witness tells you.</div>';

    const hl = HIDING.filter(h => S.hide[h] !== 1);
    $("hleft").textContent = hl.length + " left";
    $("hide").innerHTML = HIDING.map(h => `<div class="tile ${S.hide[h] === 1 ? "out" : ""} ${S.hide[h] === 2 ? "yes" : ""} ${hl.length === 1 && hl[0] === h && S.hide[h] !== 2 ? "last" : ""}" onclick="tapHide('${h}')">${h}${S.hide[h] === 1 ? '<div class="mark">\u2715</div>' : S.hide[h] === 2 ? '<div class="mark">\u2713</div>' : ""}</div>`).join("");

    $("wits").innerHTML = WITNESSES.map(w => `<div class="wit"><button class="${S.vis[w[0]] ? "v" : ""}" onclick="S.vis['${w[0]}']=!S.vis['${w[0]}'];save();render()">${S.vis[w[0]] ? "\u2713" : ""}</button><label>${w[0]}<small>${w[1]}</small></label><input value="${esc(S.wn[w[0]] || "")}" placeholder="note" oninput="S.wn['${w[0]}']=this.value;save()"></div>`).join("");
    save();
  }

  /* ---------- ACTIONS ---------- */
  function tapSuspect(n) { const d = derived(); S.m[n] = isOut(n, d) && !S.m[n] ? 2 : ((S.m[n] || 0) + 1) % 3; if (!S.m[n]) delete S.m[n]; vib(); render(); }
  function tapHide(h) { S.hide[h] = ((S.hide[h] || 0) + 1) % 3; vib(); render(); }
  function addClue() { S.clues.push({ w: $("whoSel").value, t: S.sel, has: S.has, wise: 0 }); vib(); render(); }
  function cycleWise(i) { S.clues[i].wise = (S.clues[i].wise + 1) % 3; render(); }
  function delClue(i) { S.clues.splice(i, 1); render(); }
  function allTruthful() { S.clues.forEach(c => { if (!c.wise) c.wise = 1; }); render(); }
  function newCase() { if (confirm("Start a new case? Marks, clues, and notes clear. Your traits stay.")) { S = Object.assign(S, fresh()); render(); } }
  const vib = () => { if (navigator.vibrate) navigator.vibrate(8); };

  /* ---------- TRAIT EDITOR ---------- */
  function newTrait() {
    const name = prompt("New trait name (for example: Bow tie)"); if (!name || !name.trim()) return;
    const id = "t" + Date.now(); S.traits.push({ id, name: name.trim().slice(0, 16), set: [], ready: false }); S.sel = id; editTrait(id);
  }
  function editTrait(id) {
    const t = trait(id); if (!t) return;
    $("panel").innerHTML = `<h3>${esc(t.name)}</h3><p>Tap everyone who HAS this trait on the suspect board.</p><div class="grid" id="tgrid"></div>
      <div class="row"><button class="go" onclick="doneTrait('${id}')">Done</button>${PRESET_TRAITS.some(p => p.id === id) ? "" : `<button class="btn" onclick="delTrait('${id}')">Delete trait</button>`}</div>`;
    const draw = () => { $("tgrid").innerHTML = SUSPECTS.map(s => `<div class="tile ${t.set.includes(s.n) ? "yes" : ""}" onclick="flipMember('${id}',${s.n})"><b>${s.n}</b>${face(s)}<small>${esc(s.name)}</small>${t.set.includes(s.n) ? '<div class="mark">\u2713</div>' : ""}</div>`).join(""); };
    window.redrawTrait = draw; draw(); $("sheet").classList.add("show");
  }
  function flipMember(id, n) { const t = trait(id), i = t.set.indexOf(n); i < 0 ? t.set.push(n) : t.set.splice(i, 1); window.redrawTrait(); }
  function doneTrait(id) { trait(id).ready = true; closeSheet(); render(); }
  function delTrait(id) { if (confirm("Delete this trait and its clues?")) { S.traits = S.traits.filter(t => t.id !== id); S.clues = S.clues.filter(c => c.t !== id); S.sel = "hat"; closeSheet(); render(); } }
  function closeSheet() { $("sheet").classList.remove("show"); render(); }

  let lock = null;
  async function wake() { try { if ("wakeLock" in navigator) lock = await navigator.wakeLock.request("screen"); } catch (e) {} }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wake(); });
  document.addEventListener("pointerdown", wake, { once: true });
  render(); wake();
</script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>
