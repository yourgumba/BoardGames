<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest-tools.json">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-tools-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Night Tools</title>
<style>
  /* Self-contained: no outside files. */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; color: #fff; touch-action: manipulation;
    font-family: ui-rounded, "Segoe UI", system-ui, sans-serif; background: radial-gradient(circle at top, #115e59 0%, #0f172a 75%);
    padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
  button, select, input, textarea { font: inherit; }
  button { color: inherit; cursor: pointer; }
  .wrap { max-width: 520px; margin: 0 auto; }
  h1 { margin: 0 0 10px; font-size: 24px; letter-spacing: .06em; text-transform: uppercase; }
  #tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
  #tabs button { flex: 0 0 auto; background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 10px 14px; font-weight: 800; font-size: 14px; }
  #tabs button.on { border-color: #fbbf24; background: #0f766e; }
  .card { background: rgba(15,23,42,.75); border: 1px solid #334155; border-radius: 16px; padding: 12px; margin-top: 12px; }
  .card label { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #5eead4; margin-bottom: 6px; }
  textarea, select, input { width: 100%; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 10px; padding: 10px; font-size: 16px; }
  .tool { display: none; } .tool.on { display: block; }
  .big { width: 100%; margin-top: 12px; padding: 16px; background: #fbbf24; color: #000; border: 0; border-bottom: 6px solid #d97706; border-radius: 16px; font-size: 22px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
  .big:active { transform: scale(.97); } .big:disabled { opacity: .5; }
  .sm { background: #1e293b; border: 1px solid #475569; border-radius: 10px; padding: 10px 14px; font-weight: 800; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .row > * { flex: 1; }
  .out { text-align: center; font-weight: 900; font-size: 30px; color: #fde68a; min-height: 44px; margin-top: 12px; }
  .msg { text-align: center; color: #94a3b8; font-size: 14px; margin-top: 8px; }

  /* Spinner */
  .wheelbox { position: relative; width: min(100%, 320px); margin: 14px auto 0; aspect-ratio: 1; }
  #wheel { width: 100%; height: 100%; border-radius: 50%; border: 6px solid #fff; transition: transform 4s cubic-bezier(.15, .7, .1, 1); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; z-index: 2;
             border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 28px solid #fbbf24; filter: drop-shadow(0 2px 2px rgba(0,0,0,.6)); }

  /* Timer */
  #clock { text-align: center; font-size: 84px; font-weight: 900; font-variant-numeric: tabular-nums; margin-top: 8px; }
  #clock.end { color: #f87171; animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .bar { height: 12px; background: #1e293b; border-radius: 6px; overflow: hidden; margin-top: 4px; }
  #prog { height: 100%; width: 100%; background: #22c55e; transition: width .2s linear; }

  /* Finger pad */
  #pad { position: relative; height: 260px; margin-top: 10px; border: 2px dashed #5eead4; border-radius: 16px; touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; }
  #pad p { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; margin: 0; padding: 20px; text-align: center; color: #99f6e4; pointer-events: none; }
  .dot { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; opacity: .9; transition: transform .3s, opacity .3s; pointer-events: none; }
  .dot.win { transform: scale(1.6); box-shadow: 0 0 30px #fff; } .dot.lose { opacity: .12; }

  /* Coin */
  .coinbox { perspective: 800px; display: flex; justify-content: center; margin-top: 14px; }
  #coin { width: 150px; height: 150px; position: relative; transform-style: preserve-3d; transition: transform 1.4s cubic-bezier(.2, .7, .2, 1); }
  #coin div { position: absolute; inset: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 900;
              backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 8px solid #b45309; color: #78350f; background: radial-gradient(circle at 35% 30%, #fde68a, #f59e0b); }
  #coin .t { transform: rotateY(180deg); background: radial-gradient(circle at 35% 30%, #e2e8f0, #94a3b8); border-color: #475569; color: #1e293b; }

  /* Teams */
  .team { margin-top: 10px; border-radius: 14px; padding: 10px 14px; color: #0f172a; font-weight: 800; }
  .team b { display: block; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>&#127922; Game Night Tools</h1>
  <div id="tabs"></div>

  <div class="card" id="playersCard">
    <label for="names">Players (one name per line)</label>
    <textarea id="names" rows="4" placeholder="Mom&#10;Dad&#10;Sam&#10;Alex"></textarea>
  </div>

  <!-- SPINNER -->
  <section class="tool" id="spin">
    <div class="card">
      <label for="spinSet">Spin for</label>
      <select id="spinSet">
        <option value="players">Player names (from above)</option>
        <option value="n4">Numbers 1&ndash;4</option><option value="n6">Numbers 1&ndash;6</option>
        <option value="n8">Numbers 1&ndash;8</option><option value="n10">Numbers 1&ndash;10</option><option value="n12">Numbers 1&ndash;12</option>
        <option value="colors">Colors: Red, Blue, Green, Yellow</option>
      </select>
      <div class="wheelbox"><div class="pointer"></div><canvas id="wheel" width="320" height="320"></canvas></div>
      <div class="out" id="spinOut"></div>
      <button class="big" id="spinBtn" onclick="spin()">Spin!</button>
    </div>
  </section>

  <!-- TIMER -->
  <section class="tool" id="time">
    <div class="card">
      <div id="clock">0:30</div>
      <div class="bar"><div id="prog"></div></div>
      <div class="row">
        <button class="sm" onclick="setTimer(15)">15s</button><button class="sm" onclick="setTimer(30)">30s</button><button class="sm" onclick="setTimer(60)">1m</button>
        <button class="sm" onclick="setTimer(120)">2m</button><button class="sm" onclick="setTimer(300)">5m</button>
      </div>
      <div class="row"><input id="custom" type="number" inputmode="numeric" min="1" placeholder="Custom seconds"><button class="sm" onclick="setTimer(+$('custom').value)">Set</button></div>
      <div class="row"><button class="big" id="goBtn" onclick="toggleTimer()">Start</button><button class="big" style="background:#475569;border-bottom-color:#1e293b;color:#fff" onclick="setTimer(total)">Reset</button></div>
    </div>
  </section>

  <!-- FIRST PLAYER -->
  <section class="tool" id="first">
    <div class="card">
      <label>Pick from the names above</label>
      <button class="big" style="margin-top:0" onclick="pickName()">Who goes first?</button>
      <div class="out" id="firstOut"></div>
    </div>
    <div class="card">
      <label>Or use the finger picker</label>
      <div id="pad"><p id="padMsg">Everyone put one finger on this box and hold still</p></div>
    </div>
  </section>

  <!-- COIN -->
  <section class="tool" id="coin">
    <div class="card">
      <div class="coinbox"><div id="coin"><div class="h">H</div><div class="t">T</div></div></div>
      <div class="out" id="coinOut">Tap to flip</div>
      <button class="big" onclick="flip()">Flip coin</button>
      <div class="msg" id="tally">Heads 0 &nbsp;|&nbsp; Tails 0</div>
    </div>
  </section>

  <!-- TEAMS -->
  <section class="tool" id="team">
    <div class="card">
      <label for="teamN">Number of teams</label>
      <select id="teamN"><option>2</option><option>3</option><option>4</option></select>
      <button class="big" onclick="makeTeams()">Make teams</button>
      <div id="teamOut"></div>
    </div>
  </section>
</div>

<script>
  const $ = id => document.getElementById(id);
  const PAL = ["#ef4444", "#f59e0b", "#22c55e", "#06b6d4", "#3b82f6", "#a855f7", "#ec4899", "#84cc16"];
  const TABS = [["spin", "\uD83C\uDFA1 Spinner"], ["time", "\u23F1 Timer"], ["first", "\uD83D\uDC46 First Player"], ["coin", "\uD83E\uDE99 Coin"], ["team", "\uD83D\uDC65 Teams"]];
  const NEEDS_NAMES = ["spin", "first", "team"];

  /* Fair random number 0..n-1 (secure generator) */
  function rnd(n) { const lim = Math.floor(4294967296 / n) * n, a = new Uint32Array(1); do { crypto.getRandomValues(a); } while (a[0] >= lim); return a[0] % n; }
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const names = () => $("names").value.split("\n").map(s => s.trim()).filter(Boolean);
  const buzz = p => { if (navigator.vibrate) navigator.vibrate(p); };

  /* ---------- TABS ---------- */
  function show(id) {
    document.querySelectorAll(".tool").forEach(t => t.classList.toggle("on", t.id === id));
    [...$("tabs").children].forEach((b, i) => b.classList.toggle("on", TABS[i][0] === id));
    $("playersCard").style.display = NEEDS_NAMES.includes(id) ? "block" : "none";
    try { localStorage.setItem("gnt_tab", id); } catch (e) {}
  }
  $("tabs").innerHTML = TABS.map(([id, label]) => `<button onclick="show('${id}')">${label}</button>`).join("");

  /* ---------- SPINNER ---------- */
  let rot = 0, spinning = false;
  function spinLabels() {
    const v = $("spinSet").value;
    if (v === "players") { const n = names(); return n.length >= 2 ? n : null; }
    if (v === "colors") return ["Red", "Blue", "Green", "Yellow"];
    return Array.from({ length: +v.slice(1) }, (_, i) => String(i + 1));
  }
  function drawWheel() {
    const L = spinLabels(), c = $("wheel").getContext("2d"), S = 320, R = 160;
    c.clearRect(0, 0, S, S);
    if (!L) { c.fillStyle = "#334155"; c.beginPath(); c.arc(R, R, R, 0, 7); c.fill(); c.fillStyle = "#fff"; c.font = "bold 18px sans-serif"; c.textAlign = "center"; c.fillText("Add 2+ player names", R, R); return; }
    const seg = 2 * Math.PI / L.length, fs = L.length <= 8 ? 22 : L.length <= 12 ? 17 : 13;
    L.forEach((t, i) => {
      const a0 = -Math.PI / 2 + i * seg;
      c.fillStyle = PAL[i % PAL.length]; c.beginPath(); c.moveTo(R, R); c.arc(R, R, R, a0, a0 + seg); c.fill();
      c.save(); c.translate(R, R); c.rotate(a0 + seg / 2); c.textAlign = "right"; c.fillStyle = "#fff"; c.strokeStyle = "rgba(0,0,0,.6)"; c.lineWidth = 3;
      c.font = `900 ${fs}px sans-serif`; const label = t.length > 11 ? t.slice(0, 10) + "\u2026" : t; c.strokeText(label, R - 14, fs / 3); c.fillText(label, R - 14, fs / 3); c.restore();
    });
  }
  function spin() {
    const L = spinLabels(); if (!L || spinning) return;
    spinning = true; $("spinBtn").disabled = true; $("spinOut").textContent = ""; buzz([20, 40, 20]);
    rot += 1800 + rnd(360000) / 1000;
    $("wheel").style.transform = `rotate(${rot}deg)`;
    setTimeout(() => {
      const ang = (360 - (rot % 360)) % 360, idx = Math.floor(ang / (360 / L.length));
      $("spinOut").textContent = L[idx]; buzz([60, 40, 60]); spinning = false; $("spinBtn").disabled = false;
    }, 4200);
  }
  $("spinSet").onchange = drawWheel;

  /* ---------- TIMER ---------- */
  let total = 30, left = 30, running = false, endAt = 0, tick = null, audio = null;
  const fmt = s => Math.floor(s / 60) + ":" + String(Math.ceil(s) % 60).padStart(2, "0");
  function drawClock() {
    $("clock").textContent = left <= 0 ? "0:00" : (left >= 60 ? fmt(left) : Math.ceil(left) >= 60 ? "1:00" : "0:" + String(Math.ceil(left)).padStart(2, "0"));
    $("prog").style.width = (100 * Math.max(left, 0) / total) + "%";
    $("prog").style.background = left < total * .2 ? "#ef4444" : left < total * .5 ? "#f59e0b" : "#22c55e";
  }
  function setTimer(s) {
    if (!(s > 0)) return; clearInterval(tick); running = false; total = left = s;
    $("goBtn").textContent = "Start"; $("clock").classList.remove("end"); drawClock();
  }
  function toggleTimer() {
    if (running) { clearInterval(tick); running = false; $("goBtn").textContent = "Resume"; return; }
    if (left <= 0) left = total;
    $("clock").classList.remove("end"); running = true; endAt = Date.now() + left * 1000; $("goBtn").textContent = "Pause";
    tick = setInterval(() => {
      left = (endAt - Date.now()) / 1000; drawClock();
      if (left <= 0) { clearInterval(tick); running = false; left = 0; drawClock(); $("goBtn").textContent = "Start"; $("clock").classList.add("end"); alarm(); }
    }, 100);
  }
  function alarm() {
    buzz([300, 150, 300, 150, 500]);
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      for (let i = 0; i < 3; i++) {
        const t = audio.currentTime + i * 0.35, o = audio.createOscillator(), g = audio.createGain();
        o.type = "square"; o.frequency.value = 880; g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
        o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + 0.3);
      }
    } catch (e) {}
  }

  /* ---------- FIRST PLAYER ---------- */
  function pickName() {
    const n = names(); if (n.length < 2) { $("firstOut").textContent = "Add 2+ names above"; return; }
    let i = 0; const t = setInterval(() => { $("firstOut").textContent = n[rnd(n.length)]; if (++i > 16) { clearInterval(t); $("firstOut").textContent = "\uD83C\uDF89 " + n[rnd(n.length)]; buzz([60, 40, 60]); } }, 90);
  }
  // Finger picker: everyone touches the box; after 2 seconds of holding still, one finger is chosen
  const pad = $("pad"), fingers = new Map(); let padTimer = null, locked = false;
  function padArm() {
    clearTimeout(padTimer);
    if (!fingers.size || locked) return;
    $("padMsg").textContent = fingers.size + " finger" + (fingers.size > 1 ? "s" : "") + "... hold still";
    padTimer = setTimeout(() => {
      const ids = [...fingers.keys()], win = ids[rnd(ids.length)]; locked = true;
      ids.forEach(id => fingers.get(id).classList.add(id === win ? "win" : "lose")); buzz([80, 40, 80]);
      $("padMsg").textContent = "Chosen! Lift your fingers";
    }, 2000);
  }
  pad.addEventListener("pointerdown", e => {
    if (locked) return; const r = pad.getBoundingClientRect(), d = document.createElement("div");
    d.className = "dot"; d.style.left = e.clientX - r.left + "px"; d.style.top = e.clientY - r.top + "px"; d.style.background = PAL[fingers.size % PAL.length];
    pad.appendChild(d); fingers.set(e.pointerId, d); pad.setPointerCapture && pad.setPointerCapture(e.pointerId); padArm();
  });
  const lift = e => {
    const d = fingers.get(e.pointerId); if (!d) return; d.remove(); fingers.delete(e.pointerId);
    if (!fingers.size) { locked = false; clearTimeout(padTimer); $("padMsg").textContent = "Everyone put one finger on this box and hold still"; } else padArm();
  };
  pad.addEventListener("pointerup", lift); pad.addEventListener("pointercancel", lift);

  /* ---------- COIN ---------- */
  let coinDeg = 0, heads = 0, tails = 0, flipping = false;
  function flip() {
    if (flipping) return; flipping = true; $("coinOut").textContent = "";
    const tailsUp = rnd(2) === 1;
    coinDeg = Math.ceil(coinDeg / 360) * 360 + 1800 + (tailsUp ? 180 : 0);
    $("coin").style.transform = `rotateY(${coinDeg}deg)`; buzz(30);
    setTimeout(() => {
      tailsUp ? tails++ : heads++; $("coinOut").textContent = tailsUp ? "TAILS" : "HEADS";
      $("tally").innerHTML = `Heads ${heads} &nbsp;|&nbsp; Tails ${tails}`; flipping = false; buzz([50, 30, 50]);
    }, 1500);
  }
  $("coin").onclick = flip;

  /* ---------- TEAMS ---------- */
  function makeTeams() {
    const n = names(), k = +$("teamN").value;
    if (n.length < k) { $("teamOut").innerHTML = `<div class="msg">Add at least ${k} names above</div>`; return; }
    const teams = Array.from({ length: k }, () => []);
    shuffle(n).forEach((p, i) => teams[i % k].push(p));
    $("teamOut").innerHTML = teams.map((t, i) => `<div class="team" style="background:${PAL[(i * 2) % PAL.length]}"><b>Team ${i + 1}</b>${t.map(x => x.replace(/</g, "&lt;")).join(", ")}</div>`).join("");
    buzz(40);
  }

  /* ---------- START ---------- */
  try { $("names").value = localStorage.getItem("gnt_names") || ""; } catch (e) {}
  $("names").oninput = () => { try { localStorage.setItem("gnt_names", $("names").value); } catch (e) {} if ($("spinSet").value === "players") drawWheel(); };
  let lock = null;
  async function wake() { try { if ("wakeLock" in navigator) lock = await navigator.wakeLock.request("screen"); } catch (e) {} }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wake(); });
  document.addEventListener("pointerdown", wake, { once: true });
  drawWheel(); drawClock();
  let start = "spin"; try { start = localStorage.getItem("gnt_tab") || "spin"; } catch (e) {}
  show(TABS.some(t => t[0] === start) ? start : "spin");
</script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>
