<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Clue Junior - Digital Detective Scorecard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome for fallback UI icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0f172a;
      background-image: radial-gradient(#334155 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      touch-action: manipulation;
    }

    .font-game {
      font-family: 'Fredoka One', cursive, sans-serif;
    }

    /* Paper Pad Visual Aesthetics */
    .paper-sheet {
      background: #fdfbf7;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.5), 0 10px 15px -5px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    /* Notepad Top Binding Effect */
    .paper-sheet::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 10px;
      background: repeating-linear-gradient(
        90deg,
        #475569,
        #475569 18px,
        #1e293b 18px,
        #1e293b 36px
      );
      border-radius: 1rem 1rem 0 0;
    }

    /* Interactive Item Card States */
    .item-card {
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      -webkit-user-select: none;
      position: relative;
    }

    /* State 1: Red Cross-out (Eliminated) */
    .state-eliminated {
      background-color: #ffe4e6 !important;
      border-color: #f43f5e !important;
    }

    .state-eliminated::after {
      content: '✕';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 5rem;
      color: rgba(225, 29, 72, 0.85);
      font-weight: 900;
      line-height: 1;
      pointer-events: none;
      text-shadow: 0 0 5px #fff;
      filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.3));
    }

    .state-eliminated .card-content {
      opacity: 0.3;
      filter: grayscale(80%);
    }

    /* State 2: Green Confirmed Checkmark (Hit/Found) */
    .state-confirmed {
      background-color: #dcfce7 !important;
      border-color: #16a34a !important;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.35);
    }

    .state-confirmed::after {
      content: '✓';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 5.5rem;
      color: rgba(21, 128, 61, 0.9);
      font-weight: 900;
      line-height: 1;
      pointer-events: none;
      text-shadow: 0 0 5px #fff;
      filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.3));
    }

    .state-confirmed .card-content {
      opacity: 0.4;
    }

    /* Custom Category Header Styling */
    .header-yellow { background-color: #fef08a; border-color: #eab308; color: #713f12; }
    .header-blue { background-color: #bae6fd; border-color: #0284c7; color: #0c4a6e; }
    .header-white { background-color: #f1f5f9; border-color: #64748b; color: #1e293b; }
    .header-purple { background-color: #f5d0fe; border-color: #c084fc; color: #581c87; }
  </style>
</head>
<body class="min-h-screen py-4 px-2 sm:px-4 flex flex-col items-center justify-start">

    <div class="flex justify-between items-center mb-3 px-2">

        <span class="inline-block w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-xs sm:text-sm font-bold tracking-wider uppercase text-slate-300">Digital Detective Pad</span>
      </div>
      <button 
        onclick="confirmReset()" 
        class="bg-rose-600 hover:bg-rose-700 active:scale-95 text-white font-bold text-xs sm:text-sm px-4 py-2 rounded-xl shadow-lg transition-all duration-150 flex items-center gap-2 border border-rose-500">
        <i class="fa-solid fa-rotate-left"></i> Reset Sheet
      </button>
    </div>

    <!-- Paper Game Notepad Container -->
    <div class="paper-sheet rounded-2xl p-4 sm:p-6 text-slate-800 border-2 border-slate-300">
      
      <!-- Title & Header Banner -->
      <div class="text-center mb-6 pb-4 border-b-2 border-dashed border-slate-300">
        <div class="flex items-center justify-center gap-3 mb-2 flex-wrap">
          <div class="bg-amber-500 text-white font-game text-3xl sm:text-5xl px-5 py-1.5 rounded-2xl tracking-wider shadow-md transform -rotate-1 border-2 border-amber-600">
            CLUE <span class="text-amber-100 text-2xl sm:text-4xl">JUNIOR</span>
          </div>
        </div>
        <h2 class="font-game text-slate-700 text-base sm:text-2xl mt-3 tracking-wide">
          "Which toy is broken, who broke it, and when?"
        </h2>
        <div class="mt-2 inline-flex items-center gap-2 bg-amber-100/80 px-3 py-1 rounded-full border border-amber-300 text-amber-900 text-xs sm:text-sm font-semibold">
          <i class="fa-solid fa-hand-pointer text-amber-600"></i>
          <span>Tap 1x: Cross off (X) &nbsp;|&nbsp; Tap 2x: Confirm (✓) &nbsp;|&nbsp; Tap 3x: Clear</span>
        </div>
      </div>

      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
        
        <!-- COLUMN 1: TIMES -->
        <div class="flex flex-col gap-2.5">
          <div class="col-header header-yellow p-3 rounded-xl border-2 text-center shadow-sm">
            <h3 class="font-game text-lg sm:text-xl leading-tight">TIMES</h3>
            <span class="text-[10px] sm:text-xs font-bold opacity-80 block">(yellow bases)</span>
          </div>
          <div id="times-container" class="grid grid-cols-1 gap-2"></div>
        </div>

        <!-- COLUMN 2: FURNITURE -->
        <div class="flex flex-col gap-2.5">
          <div class="col-header header-blue p-3 rounded-xl border-2 text-center shadow-sm">
            <h3 class="font-game text-lg sm:text-xl leading-tight">FURNITURE</h3>
            <span class="text-[10px] sm:text-xs font-bold opacity-80 block">(locations)</span>
          </div>
          <div id="furniture-container" class="grid grid-cols-1 gap-2"></div>
        </div>

        <!-- COLUMN 3: TOYS -->
        <div class="flex flex-col gap-2.5">
          <div class="col-header header-white p-3 rounded-xl border-2 text-center shadow-sm">
            <h3 class="font-game text-lg sm:text-xl leading-tight">TOYS</h3>
            <span class="text-[10px] sm:text-xs font-bold opacity-80 block">(white bases)</span>
          </div>
          <div id="toys-container" class="grid grid-cols-1 gap-2"></div>
        </div>

        <!-- COLUMN 4: CHARACTERS -->
        <div class="flex flex-col gap-2.5">
          <div class="col-header header-purple p-3 rounded-xl border-2 text-center shadow-sm">
            <h3 class="font-game text-lg sm:text-xl leading-tight">CHARACTERS</h3>
            <span class="text-[10px] sm:text-xs font-bold opacity-80 block">(suspects)</span>
          </div>
          <div id="characters-container" class="grid grid-cols-1 gap-2"></div>
        </div>

      </div>
    </div>
  </div>

        { name: "2:00" },  { name: "3:00" },  { name: "4:00" }, { name: "5:00" }
      ],
      furniture: [
        { name: "Pool Table" }, { name: "Desk" }, { name: "Chair" },
        { name: "Piano" },      { name: "Plant" }, { name: "Dining Table" }
      ],
      toys: [
        { name: "T. rex" },        { name: "Race Car" },   { name: "Teddy Bear" },
        { name: "Mr. Potato Head" }, { name: "Xylophone" }, { name: "Ball" }
      ],
      characters: [
        { name: "Col. Mustard" },  { name: "Miss Scarlett" }, { name: "Mr. Green" },
        { name: "Mrs. Peacock" },  { name: "Dr. Orchid" },    { name: "Prof. Plum" }
      ]
    };

    let cardStates = {};

    function generateCard(item, category) {
      const cardId = `${category}-${item.name.replace(/[^a-zA-Z0-9]/g, '')}`;
      cardStates[cardId] = 0;

      const card = document.createElement('div');
      card.id = cardId;
      card.className = "item-card bg-white border-2 border-slate-200 rounded-xl p-3 flex flex-col items-center justify-center cursor-pointer shadow-sm hover:border-slate-400 active:scale-95 transition-transform h-full min-h-[140px] sm:min-h-[160px]";
      
      const svgIcon = SVG_ASSETS[item.name] || `<i class="fa-solid fa-question text-slate-400"></i>`;

      card.innerHTML = `
        <div class="card-content flex flex-col items-center gap-3 w-full h-full">
          <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-xl bg-slate-50 flex items-center justify-center shrink-0 border-2 border-slate-200 p-1 shadow-inner">
            ${svgIcon}
          </div>
          <span class="font-bold text-slate-800 text-sm sm:text-base text-center leading-tight mt-auto w-full px-1">${item.name}</span>
        </div>
      `;

      card.addEventListener('click', () => cycleCardState(cardId));
      return card;
    }

    function initGameSheet() {
      const timesContainer = document.getElementById('times-container');
      const furnitureContainer = document.getElementById('furniture-container');
      const toysContainer = document.getElementById('toys-container');
      const charactersContainer = document.getElementById('characters-container');

      GAME_CATEGORIES.times.forEach(item => timesContainer.appendChild(generateCard(item, 'time')));
      GAME_CATEGORIES.furniture.forEach(item => furnitureContainer.appendChild(generateCard(item, 'furniture')));
      GAME_CATEGORIES.toys.forEach(item => toysContainer.appendChild(generateCard(item, 'toy')));
      GAME_CATEGORIES.characters.forEach(item => charactersContainer.appendChild(generateCard(item, 'character')));

      loadStateFromStorage();
    }

    function cycleCardState(cardId) {
      const current = cardStates[cardId] || 0;
      const next = (current + 1) % 3;
      cardStates[cardId] = next;

      const cardElement = document.getElementById(cardId);
      if (!cardElement) return;

      cardElement.classList.remove('state-eliminated', 'state-confirmed');

      if (next === 1) {
        cardElement.classList.add('state-eliminated');
      } else if (next === 2) {
        cardElement.classList.add('state-confirmed');
      }

      saveStateToStorage();
    }

    function confirmReset() {
      const hasModifiedItems = Object.values(cardStates).some(state => state !== 0);
      if (!hasModifiedItems) return;

      if (window.confirm("Start a new game? This will reset all marked items on your sheet.")) {
        resetSheet();
      }
    }

    function resetSheet() {
      Object.keys(cardStates).forEach(cardId => {
        cardStates[cardId] = 0;
        const cardElement = document.getElementById(cardId);
        if (cardElement) {
          cardElement.classList.remove('state-eliminated', 'state-confirmed');
        }
      });
      localStorage.removeItem('clue_junior_card_states');
    }

    function saveStateToStorage() {
      localStorage.setItem('clue_junior_card_states', JSON.stringify(cardStates));
    }

    function loadStateFromStorage() {
      const saved = localStorage.getItem('clue_junior_card_states');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          Object.keys(parsed).forEach(cardId => {
            const state = parsed[cardId];
            cardStates[cardId] = state;
            const cardElement = document.getElementById(cardId);
            if (cardElement) {
              if (state === 1) cardElement.classList.add('state-eliminated');
              if (state === 2) cardElement.classList.add('state-confirmed');
            }
          });
        } catch(e) {
          console.error("Error restoring saved scorecard state", e);
        }
      }
    }

    window.onload = initGameSheet;
  </script>

</body>
</html>
