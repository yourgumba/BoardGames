<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest-sorry.json">
<meta name="theme-color" content="#0369a1">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-sorry-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorry! Mobile Deck</title>
<style>
  /* Self-contained: no Tailwind, no web fonts, no outside files. */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden; color: #fff;
    font-family: ui-rounded, "Inter", "Segoe UI", system-ui, sans-serif; touch-action: manipulation;
    background: radial-gradient(circle at top, #1e3a8a 0%, #020617 100%);
    padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
             max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  }
  button { font: inherit; cursor: pointer; color: inherit; }

  /* Header */
  header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 440px; margin: 0 auto; }
  h1 { margin: 0; font-size: 26px; font-weight: 900; font-style: italic; letter-spacing: .08em; }
  h1 span { color: #f43f5e; } h1 small { font-size: 13px; font-style: normal; color: #94a3b8; letter-spacing: .1em; }
  #countBtn { background: #0f172a; border: 1px solid #475569; border-radius: 999px; padding: 6px 16px; font-size: 13px; font-weight: 800; color: #cbd5e1; text-transform: uppercase; }
  #count { font-size: 24px; color: #fbbf24; margin-left: 4px; }

  /* Tally panel and recent strip */
  #tally { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; width: 100%; max-width: 440px; margin: 8px auto 0;
           background: rgba(15,23,42,.85); border: 1px solid #475569; border-radius: 14px; padding: 8px; }
  #tally[hidden] { display: none; }
  .chip { background: #1e293b; border-radius: 10px; padding: 4px 10px; font-size: 13px; font-weight: 800; }
  .chip b { color: #fbbf24; margin-left: 4px; } .chip.zero { opacity: .35; }
  #recent { display: flex; gap: 6px; align-items: center; justify-content: center; width: 100%; max-width: 440px;
            margin: 8px auto 0; min-height: 28px; font-size: 12px; color: #94a3b8; font-weight: 700; }
  .rc { min-width: 30px; text-align: center; background: #e2e8f0; color: #0f172a; border-radius: 8px; padding: 3px 7px; font-weight: 900; font-size: 13px; opacity: .6; }
  .rc:first-of-type { opacity: 1; outline: 2px solid #fbbf24; }

  /* Card */
  .scene { flex: 1; min-height: 0; width: 100%; max-width: 440px; margin: 8px auto; perspective: 1200px; }
  .card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; border-radius: 24px; cursor: pointer;
          transition: transform .5s cubic-bezier(.2, .85, .4, 1.2); box-shadow: 0 15px 35px -5px rgba(0,0,0,.8); }
  .card.flip { transform: rotateY(180deg); }
  .card.noanim { transition: none; }
  .face { position: absolute; inset: 0; border-radius: 24px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; }

  /* Original card back */
  .back { border: 10px solid #e2e8f0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
          background: repeating-linear-gradient(45deg, #0f766e 0 16px, #115e59 16px 32px); }
  .back svg { width: 46%; max-width: 160px; filter: drop-shadow(2px 3px 3px rgba(0,0,0,.5)); }
  .back p { margin: 0; font-weight: 900; letter-spacing: .25em; font-size: 14px; color: #ccfbf1; text-shadow: 1px 1px 2px rgba(0,0,0,.6); }

  /* Card front: top half is flipped so the player across the table can read it */
  .front { transform: rotateY(180deg); background: #fdfbf7; border: 10px solid #fff; display: flex; flex-direction: column; padding: 8px 10px; }
  .front::after { content: ""; position: absolute; inset: 3px; border: 2px solid #1e293b; border-radius: 14px; opacity: .7; pointer-events: none; }
  .half { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4px; }
  .half.top { transform: rotate(180deg); }
  .num { color: #000; font-weight: 900; font-size: clamp(4rem, 14vh, 8.5rem); line-height: .9; letter-spacing: -.05em; text-shadow: 0 1px 1px rgba(255,255,255,.5); }
  .num.sorry { font-size: clamp(2.6rem, 9vh, 5.5rem); font-style: italic; letter-spacing: -.02em; }
  .rule { color: #000; font-weight: 800; font-size: clamp(1.15rem, 3.8vh, 2.4rem); line-height: 1.15; margin-top: 6px; }
  .rule.long { font-size: clamp(1rem, 3vh, 2rem); }
  .mid { position: relative; height: 0; border-top: 2px dashed #cbd5e1; margin: 2px 0; }
  #again { display: none; position: absolute; left: 50%; top: 0; transform: translate(-50%, -50%); z-index: 3; white-space: nowrap;
           background: #f43f5e; color: #fff; font-weight: 900; font-size: 15px; letter-spacing: .08em; padding: 6px 16px; border-radius: 999px;
           border: 2px solid #fff; animation: pulse 1s ease-in-out infinite; }
  #again.show { display: block; }
  @keyframes pulse { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.12); } }

  /* Controls */
  .controls { width: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .draw { background: #fbbf24; color: #000; border: 0; border-bottom: 6px solid #d97706; border-radius: 18px; padding: 16px;
          font-weight: 900; font-size: 24px; letter-spacing: .1em; text-transform: uppercase; }
  .draw.again { background: #fb7185; border-bottom-color: #be123c; }
  .draw:active { transform: scale(.97); }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; background: #1e293b; border: 0; border-bottom: 4px solid #020617; border-radius: 14px; padding: 12px 6px;
                font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; }
  .row button:active { transform: scale(.96); }

  #toast { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translate(-50%, -200%); opacity: 0; z-index: 9;
           background: #fbbf24; color: #000; font-weight: 800; padding: 10px 22px; border-radius: 999px; border: 2px solid #d97706; }
  #toast.show { animation: slide 3s forwards; }
  @keyframes slide { 0% { transform: translate(-50%,-200%); opacity: 0; } 10%,90% { transform: translate(-50%,0); opacity: 1; } 100% { transform: translate(-50%,-200%); opacity: 0; } }
</style>
</head>
<body>
<div id="toast">Deck is empty! Reshuffling...</div>

<header>
  <h1>SORRY<span>!</span> <small>DECK</small></h1>
  <button id="countBtn" onclick="toggleTally()" title="Tap to see what's left">Cards:<span id="count">45</span></button>
</header>
<div id="tally" hidden></div>
<div id="recent"></div>

<div class="scene">
  <div class="card" id="card" onclick="draw()">
    <div class="face back">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="44" fill="#f59e0b" stroke="#fff" stroke-width="4"/>
        <polygon points="50,18 58,40 82,40 63,54 70,78 50,64 30,78 37,54 18,40 42,40" fill="#fff"/>
      </svg>
      <p>TAP TO DRAW</p>
    </div>
    <div class="face front">
      <div class="half top"><div class="num" id="valT"></div><div class="rule" id="ruleT"></div></div>
      <div class="mid"><span id="again">DRAW AGAIN!</span></div>
      <div class="half"><div class="num" id="valB"></div><div class="rule" id="ruleB"></div></div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="draw" id="drawBtn" onclick="draw()">Draw Card</button>
  <div class="row">
    <button onclick="shuffle()">&#8635; Shuffle</button>
    <button id="readBtn" onclick="readAloud()">&#128266; Read</button>
    <button id="soundBtn" onclick="toggleSound()">&#128276; Sound</button>
  </div>
</div>

<script>
  /* ---------- CARDS (edit rules here) ---------- */
  // 45 cards: five 1s, and four of everything else.
  const CARD_RULES = [
    { val: "1",  text: "Move a pawn from Start OR move forward 1 space.", count: 5 },
    { val: "2",  text: "Move from Start OR move forward 2. DRAW AGAIN.", count: 4 },
    { val: "3",  text: "Move one pawn forward 3 spaces.", count: 4 },
    { val: "4",  text: "Move one pawn backward 4 spaces.", count: 4 },
    { val: "5",  text: "Move one pawn forward 5 spaces.", count: 4 },
    { val: "7",  text: "Move forward 7 spaces OR split between two pawns.", count: 4 },
    { val: "8",  text: "Move one pawn forward 8 spaces.", count: 4 },
    { val: "10", text: "Move forward 10 spaces OR backward 1 space.", count: 4 },
    { val: "11", text: "Move forward 11 spaces OR switch places with an opponent.", count: 4 },
    { val: "12", text: "Move one pawn forward 12 spaces.", count: 4 },
    { val: "SORRY!", text: "Take a pawn from Start, place it on an opponent's pawn, and send them back to Start.", count: 4 }
  ];

  /* ---------- STATE (saved on the phone so a game survives closing the app) ---------- */
  const KEY = "sorry_deck_v2";
  let deck = [], history = [], current = null, flipped = false, busy = false, soundOn = true;
  const $ = id => document.getElementById(id);
  const card = $("card");

  function save() { try { localStorage.setItem(KEY, JSON.stringify({ deck, history, current, soundOn })); } catch (e) {} }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.deck)) { deck = s.deck; history = s.history || []; current = s.current || null; soundOn = s.soundOn !== false; return true; }
    } catch (e) {}
    return false;
  }

  function newDeck() {
    deck = [];
    CARD_RULES.forEach(c => { for (let i = 0; i < c.count; i++) deck.push({ val: c.val, text: c.text }); });
    for (let i = deck.length - 1; i > 0; i--) {            // Fisher-Yates shuffle
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    history = []; current = null;
  }

  /* ---------- SCREEN ---------- */
  function render() {
    $("count").textContent = deck.length;
    $("recent").innerHTML = history.length
      ? "Last:" + history.map(v => `<span class="rc">${v}</span>`).join("") : "";
    $("tally").innerHTML = CARD_RULES.map(r => {
      const n = deck.filter(c => c.val === r.val).length;
      return `<span class="chip ${n ? "" : "zero"}">${r.val}<b>${n}</b></span>`;
    }).join("");
    const again = current && current.val === "2";
    $("again").classList.toggle("show", !!again && flipped);
    $("drawBtn").classList.toggle("again", !!again && flipped);
    $("drawBtn").textContent = again && flipped ? "Draw Again!" : "Draw Card";
    $("soundBtn").innerHTML = soundOn ? "&#128276; Sound" : "&#128277; Muted";
  }

  function fillCard(c) {
    const big = c.val === "SORRY!" ? "num sorry" : "num";
    const rule = c.text.length > 60 ? "rule long" : "rule";
    ["T", "B"].forEach(k => {
      $("val" + k).textContent = c.val; $("val" + k).className = big;
      $("rule" + k).textContent = c.text; $("rule" + k).className = rule;
    });
  }

  function toggleTally() { $("tally").hidden = !$("tally").hidden; }

  /* ---------- ACTIONS ---------- */
  function draw() {
    if (busy) return;
    wake();
    if (deck.length === 0) { toast(); shuffle(true); return; }
    busy = true;
    if (flipped) {                       // flip face down first, then draw the next card
      card.classList.remove("flip"); flipped = false; render();
      setTimeout(next, 300);
    } else next();
  }

  function next() {
    const c = deck.pop();
    current = c; history.unshift(c.val); history = history.slice(0, 5);
    fillCard(c);
    card.classList.add("flip"); flipped = true;
    render(); save();
    beep(c.val === "SORRY!" ? "low" : "flip");
    buzz(c.val === "2" ? [30, 60, 30] : 15);
    setTimeout(() => { busy = false; }, 400);
  }

  function shuffle(auto) {
    if (busy && !auto) return;
    busy = true;
    card.classList.remove("flip"); flipped = false;
    setTimeout(() => { newDeck(); render(); save(); busy = false; }, 400);
  }

  function toast() { const t = $("toast"); t.classList.remove("show"); void t.offsetWidth; t.classList.add("show"); }

  /* ---------- EXTRAS: sound, buzz, read aloud, screen awake ---------- */
  let audio = null;
  function beep(kind) {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const [f1, f2] = kind === "low" ? [330, 140] : [320, 560];
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "triangle"; o.frequency.setValueAtTime(f1, audio.currentTime);
      o.frequency.exponentialRampToValueAtTime(f2, audio.currentTime + 0.12);
      g.gain.setValueAtTime(0.15, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.18);
      o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.2);
    } catch (e) {}
  }
  function buzz(p) { if (soundOn && navigator.vibrate) navigator.vibrate(p); }   // Android only
  function toggleSound() { soundOn = !soundOn; render(); save(); }

  function readAloud() {
    if (!("speechSynthesis" in window) || !current) return;
    speechSynthesis.cancel();
    const say = (current.val === "SORRY!" ? "Sorry! " : current.val + ". ") + current.text.replace("SORRY!", "Sorry");
    speechSynthesis.speak(new SpeechSynthesisUtterance(say));
  }

  let lock = null;
  async function wake() { try { if ("wakeLock" in navigator) lock = await navigator.wakeLock.request("screen"); } catch (e) {} }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wake(); });

  /* ---------- START ---------- */
  if (!("speechSynthesis" in window)) $("readBtn").style.display = "none";
  if (!load()) newDeck();
  if (current) {                          // restore a card that was face-up when the app closed
    fillCard(current);
    card.classList.add("noanim", "flip"); flipped = true;
    void card.offsetWidth; card.classList.remove("noanim");
  }
  render();
  wake();
</script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>
